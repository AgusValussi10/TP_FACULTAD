<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unión del Sur — Admin</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="assets/logo.png" class="sidebar-logo-img" alt="Unión del Sur">
      <h2>Unión del Sur</h2>
      <p>Panel Admin</p>
    </div>
    <nav>
      <a href="#" class="nav-item active" data-section="reportes">
        <span class="nav-icon">📊</span> Dashboard
      </a>
      <a href="#" class="nav-item" data-section="categorias">
        <span class="nav-icon">🏆</span> Categorías
      </a>
      <a href="#" class="nav-item" data-section="jugadores">
        <span class="nav-icon">👥</span> Jugadores
      </a>
      <a href="#" class="nav-item" data-section="cuotas">
        <span class="nav-icon">💰</span> Cuotas
      </a>
      <a href="#" class="nav-item" data-section="seguros">
        <span class="nav-icon">🛡️</span> Seguros
      </a>
      <a href="#" class="nav-item" data-section="carnets">
        <span class="nav-icon">🎫</span> Carnets
      </a>
      <a href="#" class="nav-item" data-section="asistencia">
        <span class="nav-icon">✅</span> Asistencia
      </a>
      <a href="#" class="nav-item" data-section="partidos">
        <span class="nav-icon">⚽</span> Partidos
      </a>
      <a href="#" class="nav-item" data-section="ia">
        <span class="nav-icon">🤖</span> Recordatorio IA
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-name" id="user-name-display">—</div>
      <button class="btn-logout" id="btn-logout">Cerrar sesión</button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <h1 id="topbar-title">Dashboard</h1>
      <div class="topbar-right">
        <span class="user-chip" id="user-chip">—</span>
      </div>
    </div>
    <div id="content-area">
      <div class="loading"><div class="spinner"></div> Cargando...</div>
    </div>
  </div>

  <!-- MODAL GLOBAL -->
  <div class="overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">—</h3>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- TOAST CONTAINER -->
  <div id="toast-container"></div>

  <!-- SCRIPTS -->
  <script src="js/api.js"></script>
  <script src="js/reportes.js"></script>
  <script src="js/categorias.js"></script>
  <script src="js/jugadores.js"></script>
  <script src="js/cuotas.js"></script>
  <script src="js/seguro.js"></script>
  <script src="js/carnets.js"></script>
  <script src="js/asistencia.js"></script>
  <script src="js/partidos.js"></script>
  <script src="js/ia.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
