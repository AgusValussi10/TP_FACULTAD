<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unión del Sur — Ingreso</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a3a1a 0%, #2d6e2d 60%, #4CAF50 100%);
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .logo-area {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      display: block;
      margin: 0 auto 8px;
    }
    .logo-area h1 {
      font-size: 22px;
      font-weight: 800;
      color: #1a3a1a;
      line-height: 1.2;
    }
    .logo-area p {
      font-size: 13px;
      color: #666;
      margin-top: 4px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #333;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #dde5dd;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      transition: border-color 0.2s;
      color: #1a1a1a;
    }
    input:focus {
      outline: none;
      border-color: #2d6e2d;
    }
    .btn-login {
      width: 100%;
      padding: 14px;
      background: #2d6e2d;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 8px;
    }
    .btn-login:hover { background: #1a5c1a; }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled { background: #aaa; cursor: not-allowed; }
    .error-msg {
      background: #fde8e8;
      color: #c0392b;
      border: 1px solid #f5c6c6;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }
    .footer-note {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo-area">
      <img src="assets/logo.png" class="logo-img" alt="Unión del Sur">
      <h1>Unión del Sur</h1>
      <p>Panel de Administración</p>
    </div>
    <div class="error-msg" id="error-msg"></div>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="admin@uniondelsur.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login" id="btn-submit">Ingresar</button>
    </form>
    <p class="footer-note">Fundación Unión del Sur · Resistencia, Chaco</p>
  </div>

  <script src="js/api.js"></script>
  <script>
    if (localStorage.getItem('jwt_token')) window.location.href = 'index.html';

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      const errorDiv = document.getElementById('error-msg');
      errorDiv.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Ingresando...';

      try {
        const data = await apiFetch('/auth/login', {
          method: 'POST',
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        localStorage.setItem('jwt_token', data.token);
        localStorage.setItem('user_nombre', data.nombre);
        localStorage.setItem('user_rol', data.rol);
        window.location.href = 'index.html';
      } catch (err) {
        errorDiv.textContent = err.message || 'Credenciales incorrectas';
        errorDiv.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Ingresar';
      }
    });
  </script>
</body>
</html>
